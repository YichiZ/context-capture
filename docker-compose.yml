services:
  proxy:
    image: mitmproxy/mitmproxy:12.3.1
    command: >-
      mitmdump --mode reverse:https://api.anthropic.com
      --listen-host 0.0.0.0 --listen-port 8080 -s /app/capture.py
    environment:
      UPSTREAM_API_KEY: ${ANTHROPIC_API_KEY:?put ANTHROPIC_API_KEY in .env}
    volumes:
      - ./capture.py:/app/capture.py:ro
      - ./captures:/app/captures
    networks: [internal, egress]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), 1)"]
      interval: 1s
      retries: 30

  agent:
    build: agent
    depends_on:
      proxy:
        condition: service_healthy
    environment:
      ANTHROPIC_BASE_URL: http://proxy:8080
      ANTHROPIC_API_KEY: placeholder  # the proxy injects the real key
      CLAUDE_CONFIG_DIR: /data/claude
      HOME: /tmp
    volumes:
      - ./transcripts:/data/claude/projects
    tmpfs:
      - /tmp
      - /data/claude:uid=1000,gid=1000
    networks: [internal]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1

networks:
  internal:
    internal: true
  egress:
